  <body>
    <div id="app"></div>
    <script src="./prototype-data.js"></script>
    <script>
      // Removed page links fall back to the first available page.
      const query = new URLSearchParams(location.search);
      if (query.has('page') && !window.PROTOTYPE.data.pages.some(page => page.id === query.get('page'))) {
        query.delete('page');
        history.replaceState(null, '', location.pathname + (query.size ? '?' + query : '') + location.hash);
      }
    </script>

  </body>
